# AutoQAD-monitorointi (Prometheus + Grafana + Loki + Promtail).
# Liittyy autoqad-net-verkkoon, jotta Prometheus tavoittaa go-backendin metriikat.
# Aja: podman compose -f monitoring_stack/docker-compose.yml up -d
services:
  loki:
    image: grafana/loki:2.9.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
      - ./loki-storage/chunks:/loki/chunks
      - ./loki-storage/index:/loki/index
      - ./loki-storage/boltdb-cache:/loki/boltdb-cache
      - ./loki-storage/wal:/loki/wal
      - ./loki-storage/compactor:/loki/compactor
    networks: [autoqad-net]

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning  # Prometheus+Loki-datalähteet
    networks: [autoqad-net]

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [autoqad-net]

  # Promtail (lokien keräys Lokiin). HUOM: konttilokien keräys Podmanissa vaatii
  # vielä lokidriverin/discoveryn konfiguroinnin (jatkokehitys); ks. promtail-config.yaml.
  promtail:
    image: grafana/promtail:2.9.1
    container_name: promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks: [autoqad-net]

volumes:
  grafana-storage:

networks:
  autoqad-net:
    external: true
