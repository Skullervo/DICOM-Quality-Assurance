<!doctype html>
<html lang="fi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Radiqa{% endblock %}</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/extra.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {% block head %}{% endblock %}
</head>
<body>
{% if authed and request.url.path != '/login' %}
<div class="app-controls">
  <div class="menu-wrap">
    <button class="ctrl-btn" id="menuBtn" aria-label="Navigointivalikko" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="menu-dropdown" id="menuDrop" hidden>
      <a href="/">Aloitus</a>
      <a href="/">Modaliteetit</a>
      <a href="/laitteet">Laitteet</a>
      <a href="/mittaukset">Mittaukset</a>
      <a href="/rajat">Hyväksyttävyysrajat</a>
      <a href="/tietoa">Tietoa</a>
    </div>
  </div>
  <button class="ctrl-btn" id="themeBtn" aria-label="Vaihda teema">☀</button>
  <a class="ctrl-btn" href="/logout" aria-label="Kirjaudu ulos" title="Kirjaudu ulos">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  </a>
</div>
{% endif %}

{% block body %}
<main class="main-content">
  {% block content %}{% endblock %}
</main>
<footer class="app-footer">
  <p>Lääketieteellisen fysiikan asiantuntijapalvelut,
    <a href="https://github.com/Skullervo" target="_blank" rel="noopener noreferrer">@skullervo</a>.</p>
</footer>
{% endblock %}

<script>
  // Teema (dark/light) — sama kuin Reactissa (data-theme + localStorage)
  (function(){
    const KEY='autoqad-theme';
    const root=document.documentElement;
    function apply(t){ root.setAttribute('data-theme',t); const b=document.getElementById('themeBtn'); if(b) b.textContent = t==='dark'?'☀':'🌙'; }
    apply(localStorage.getItem(KEY)||'dark');
    const tb=document.getElementById('themeBtn');
    if(tb) tb.addEventListener('click',()=>{ const n=(root.getAttribute('data-theme')==='dark')?'light':'dark'; localStorage.setItem(KEY,n); apply(n); });
    // Valikko
    const mb=document.getElementById('menuBtn'), md=document.getElementById('menuDrop');
    if(mb&&md){
      mb.addEventListener('click',e=>{ e.stopPropagation(); md.hidden=!md.hidden; mb.setAttribute('aria-expanded',String(!md.hidden)); });
      document.addEventListener('click',()=>{ md.hidden=true; mb.setAttribute('aria-expanded','false'); });
    }
  })();
</script>
</body>
</html>
