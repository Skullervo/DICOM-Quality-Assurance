# =============================================================================
# AutoQAD — monitorointipino cPouta-k8s:ään (Prometheus + Alertmanager + Grafana
# + kube-state-metrics + node-exporter). Toteuttaa käsikirjoituksen "continuous
# observability" -väitteet ja hälytyksen (alerting) verifioinnin.
#
# Ajo:
#   kubectl apply -f monitoring.yaml
#   kubectl -n monitoring get pods -w
#
# UI:t (NodePort, control-planen julkinen IP):
#   Prometheus   http://<node>:30090
#   Alertmanager http://<node>:30093
#   Grafana      http://<node>:30030   (admin / radiqa, anon-viewer päällä)
#
# Skreipattavat targetit: prometheus (itse), kube-state-metrics, node-exporter
# (kaikki nodet), us-analysis-podit (autoqad-ns, portti 9110 autoqad_-metriikat).
#
# Raskaat komponentit pinnattu control-planeen (4 GB); workerit jäävät analyysille.
# node-exporter ajetaan DaemonSetinä KAIKILLA nodeilla (toleraatiot).
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ===================== kube-state-metrics ====================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
- apiGroups: [""]
  resources: ["configmaps","secrets","nodes","pods","services","serviceaccounts","resourcequotas","replicationcontrollers","limitranges","persistentvolumeclaims","persistentvolumes","namespaces","endpoints"]
  verbs: ["list","watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets","daemonsets","deployments","replicasets"]
  verbs: ["list","watch"]
- apiGroups: ["batch"]
  resources: ["cronjobs","jobs"]
  verbs: ["list","watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["list","watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["list","watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app: kube-state-metrics } }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector: { kubernetes.io/hostname: autoqad-control }
      tolerations:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
        ports:
        - { name: http-metrics, containerPort: 8080 }
        - { name: telemetry, containerPort: 8081 }
        resources:
          requests: { memory: "64Mi", cpu: "20m" }
          limits:   { memory: "192Mi", cpu: "200m" }
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app: kube-state-metrics }
spec:
  selector: { app: kube-state-metrics }
  ports:
  - { name: http-metrics, port: 8080, targetPort: 8080 }
---
# ===================== node-exporter (DaemonSet, kaikki nodet) ================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels: { app: node-exporter }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
      - { operator: Exists }          # aja myös control-planella (kaikki taintit)
      containers:
      - name: node-exporter
        image: quay.io/prometheus/node-exporter:v1.8.2
        args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
        ports:
        - { name: metrics, containerPort: 9100, hostPort: 9100 }
        resources:
          requests: { memory: "24Mi", cpu: "10m" }
          limits:   { memory: "96Mi", cpu: "150m" }
        volumeMounts:
        - { name: proc, mountPath: /host/proc, readOnly: true }
        - { name: sys, mountPath: /host/sys, readOnly: true }
        - { name: root, mountPath: /host/root, mountPropagation: HostToContainer, readOnly: true }
      volumes:
      - { name: proc, hostPath: { path: /proc } }
      - { name: sys, hostPath: { path: /sys } }
      - { name: root, hostPath: { path: / } }
---
# ===================== Prometheus ============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources: ["nodes","nodes/proxy","nodes/metrics","services","endpoints","pods"]
  verbs: ["get","list","watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager:9093']

    rule_files:
    - /etc/prometheus/rules/*.yaml

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    - job_name: 'kube-state-metrics'
      static_configs:
      - targets: ['kube-state-metrics.monitoring.svc:8080']

    - job_name: 'node-exporter'
      kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [monitoring] }
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'node-exporter'
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

    # AutoQAD US-analyysipodit: autoqad_-metriikat portissa 9110.
    # Kattaa sekä vanhan pollerin (us-analysis) että event-driven workerit (us-worker).
    - job_name: 'us-analysis'
      kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [autoqad] }
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: 'us-analysis|us-worker'
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: '9110'
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  autoqad.rules.yaml: |
    groups:
    - name: autoqad-availability
      rules:
      - alert: AutoQADAnalysisDown
        expr: kube_deployment_status_replicas_available{namespace="autoqad",deployment="us-worker"} == 0
        for: 1m
        labels: { severity: critical, service: us-worker }
        annotations:
          summary: "AutoQAD US-analyysiworker alhaalla"
          description: "us-worker Deploymentissä ei ole yhtään saatavilla olevaa replikaa yli 1 minuuttiin — QA-analyysi pysähtynyt."
      - alert: AutoQADAnalysisDegraded
        expr: kube_deployment_status_replicas_available{namespace="autoqad",deployment="us-worker"} < kube_deployment_spec_replicas{namespace="autoqad",deployment="us-worker"}
        for: 2m
        labels: { severity: warning, service: us-worker }
        annotations:
          summary: "AutoQAD US-analyysi vajaakapasiteetilla"
          description: "Osa us-worker-replikoista ei ole saatavilla yli 2 minuuttiin."
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus-target alhaalla (job {{ $labels.job }})"
          description: "Target {{ $labels.instance }} (job {{ $labels.job }}) ei vastaa yli 2 minuuttiin."
    - name: autoqad-performance
      rules:
      - alert: AutoQADHighAnalysisLatency
        expr: histogram_quantile(0.95, sum(rate(autoqad_analysis_duration_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels: { severity: warning, service: us-worker }
        annotations:
          summary: "US-analyysin p95-kesto korkea"
          description: "Yhden kuvan analyysin p95-kesto yli 10 s viimeisen 5 minuutin aikana."
      - alert: NodeHighCPU
        expr: 100 - (avg by(node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Noden {{ $labels.node }} CPU yli 90%"
          description: "Noden CPU-käyttö yli 90% viimeiset 5 minuuttia."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      nodeSelector: { kubernetes.io/hostname: autoqad-control }
      tolerations:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.2
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=7d
        - --web.enable-lifecycle
        ports:
        - { name: web, containerPort: 9090 }
        resources:
          requests: { memory: "256Mi", cpu: "100m" }
          limits:   { memory: "768Mi", cpu: "500m" }
        volumeMounts:
        - { name: config, mountPath: /etc/prometheus }
        - { name: rules, mountPath: /etc/prometheus/rules }
        - { name: data, mountPath: /prometheus }
      volumes:
      - { name: config, configMap: { name: prometheus-config } }
      - { name: rules, configMap: { name: prometheus-rules } }
      - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
  - { name: web, port: 9090, targetPort: 9090, nodePort: 30090 }
---
# ===================== Alertmanager ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # Slack-webhook luetaan Secretistä (EI repossa) — ks. secret alertmanager-slack:
      #   kubectl -n monitoring create secret generic alertmanager-slack \
      #     --from-literal=webhook-url='https://hooks.slack.com/services/...'
      slack_api_url_file: /etc/alertmanager/secrets/webhook-url
    route:
      receiver: 'slack-default'
      group_by: ['alertname','service']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
      - matchers: ['severity="critical"']
        receiver: 'slack-critical'
        group_wait: 5s
    receivers:
    - name: 'slack-default'
      slack_configs:
      - channel: '#LV-automaatti'
        send_resolved: true
        title: '{{ .Status | toUpper }} · {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}{{ end }}
    - name: 'slack-critical'
      slack_configs:
      - channel: '#LV-automaatti'
        send_resolved: true
        title: ':rotating_light: {{ .Status | toUpper }} · {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Labels.severity }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}{{ end }}
    inhibit_rules:
    - source_matchers: ['severity="critical"']
      target_matchers: ['severity="warning"']
      equal: ['service']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app: alertmanager }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      nodeSelector: { kubernetes.io/hostname: autoqad-control }
      tolerations:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - { name: web, containerPort: 9093 }
        resources:
          requests: { memory: "48Mi", cpu: "20m" }
          limits:   { memory: "128Mi", cpu: "150m" }
        volumeMounts:
        - { name: config, mountPath: /etc/alertmanager }
        - { name: secrets, mountPath: /etc/alertmanager/secrets, readOnly: true }
        - { name: data, mountPath: /alertmanager }
      volumes:
      - { name: config, configMap: { name: alertmanager-config } }
      - { name: secrets, secret: { secretName: alertmanager-slack } }
      - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app: alertmanager }
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
  - { name: web, port: 9093, targetPort: 9093, nodePort: 30093 }
---
# ===================== Grafana ===============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
    - name: 'autoqad'
      orgId: 1
      folder: 'AutoQAD'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  autoqad-overview.json: |
    {
      "title": "AutoQAD — US-analyysi",
      "uid": "autoqad-us",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "type": "stat", "title": "Valmiit replikat (us-worker)",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [ { "expr": "kube_deployment_status_replicas_available{namespace=\"autoqad\",deployment=\"us-worker\"}", "refId": "A" } ]
        },
        {
          "type": "timeseries", "title": "Analysoituja kuvia / min",
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 0 },
          "targets": [ { "expr": "sum(rate(autoqad_images_processed_total[5m])) * 60", "refId": "A" } ]
        },
        {
          "type": "timeseries", "title": "Analyysin kesto p50/p95 (s)",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "histogram_quantile(0.5, sum(rate(autoqad_analysis_duration_seconds_bucket[5m])) by (le))", "refId": "A", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(autoqad_analysis_duration_seconds_bucket[5m])) by (le))", "refId": "B", "legendFormat": "p95" }
          ]
        },
        {
          "type": "timeseries", "title": "Noden CPU-käyttö %",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 6 },
          "targets": [ { "expr": "100 - (avg by(node)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "refId": "A", "legendFormat": "{{node}}" } ]
        }
      ]
    }
  autoqad-eventdriven.json: |
    {
      "title": "AutoQAD — Event-driven skaalaus",
      "uid": "autoqad-eventdriven",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "type": "stat", "title": "Aktiiviset US-workerit",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [ { "expr": "count(up{job=\"us-analysis\", app=\"us-worker\"} == 1)", "refId": "A" } ]
        },
        {
          "type": "timeseries", "title": "Läpäisy: analysoituja kuvia / min",
          "gridPos": { "h": 6, "w": 18, "x": 6, "y": 0 },
          "targets": [ { "expr": "sum(rate(autoqad_qa_results_total{modality=\"US\"}[1m])) * 60", "refId": "A", "legendFormat": "yhteensä" } ]
        },
        {
          "type": "timeseries", "title": "Per-worker läpäisy / min",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 6 },
          "targets": [ { "expr": "sum by(pod)(rate(autoqad_qa_results_total[1m])) * 60", "refId": "A", "legendFormat": "{{pod}}" } ]
        },
        {
          "type": "timeseries", "title": "Analyysin kesto p50/p95 (s)",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "histogram_quantile(0.5, sum(rate(autoqad_analysis_duration_seconds_bucket[2m])) by (le))", "refId": "A", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum(rate(autoqad_analysis_duration_seconds_bucket[2m])) by (le))", "refId": "B", "legendFormat": "p95" }
          ]
        },
        {
          "type": "timeseries", "title": "Kuvat statuksittain / min (success|failed)",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 13 },
          "targets": [ { "expr": "sum by(status)(rate(autoqad_images_processed_total[1m])) * 60", "refId": "A", "legendFormat": "{{status}}" } ]
        },
        {
          "type": "timeseries", "title": "Job-tilasiirtymät / s",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 13 },
          "targets": [ { "expr": "sum by(state)(rate(autoqad_jobs_total[1m]))", "refId": "A", "legendFormat": "{{state}}" } ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      nodeSelector: { kubernetes.io/hostname: autoqad-control }
      tolerations:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      securityContext:
        runAsUser: 472
        runAsNonRoot: true
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:11.1.4
        env:
        - { name: GF_SECURITY_ADMIN_USER, value: "admin" }
        - { name: GF_SECURITY_ADMIN_PASSWORD, value: "radiqa" }
        - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
        - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
        - { name: GF_USERS_DEFAULT_THEME, value: "dark" }
        ports:
        - { name: web, containerPort: 3000 }
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits:   { memory: "384Mi", cpu: "300m" }
        volumeMounts:
        - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
        - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
        - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
        - { name: data, mountPath: /var/lib/grafana }
      volumes:
      - { name: datasources, configMap: { name: grafana-datasources } }
      - { name: dashboard-provider, configMap: { name: grafana-dashboard-provider } }
      - { name: dashboards, configMap: { name: grafana-dashboards } }
      - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
  - { name: web, port: 3000, targetPort: 3000, nodePort: 30030 }
