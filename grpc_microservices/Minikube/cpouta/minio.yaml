# =============================================================================
# AutoQAD — MinIO S3-yhteensopiva object storage (manuscript §2.2.5)
# Analyysikuvat tallennetaan tänne hierarkkisesti: qa/<modality>/<StudyUID>/...
# Workerit kirjoittavat, Go-backend lukee (presigned URL).
#
# Credentials EIVÄT ole repossa — luo secret ennen applyä:
#   kubectl -n autoqad create secret generic minio-credentials \
#     --from-literal=access-key='<ACCESS>' --from-literal=secret-key='<SECRET>'
#
# Ajo:  kubectl apply -f minio.yaml
# Konsoli (NodePort 30901), S3 API klusterin sisällä: http://minio.autoqad.svc:9000
#
# HUOM — IMAGE: MinIO sulki community-imagensa anonyymin docker.io-pullin (2025).
#   docker.io/minio/minio -> "access denied" ilman entitlementtiä. Vaihtoehdot:
#     a) authentikoitu pull (Docker Hub -tili jolla on MinIO-entitlementti)
#     b) avoin S3-yhteensopiva vaihtoehto (SeaweedFS/Garage/Zenko) — koodi on
#        S3-geneeristä (minio/boto3 SDK), joten vain image + endpoint vaihtuu.
#   Vahvista valinta ennen cPouta-deployta. Alla oleva image edellyttää (a).
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: autoqad
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: autoqad
  labels: { app: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO-levy -> ei rinnakkaisia podeja
  selector: { matchLabels: { app: minio } }
  template:
    metadata:
      labels: { app: minio }
    spec:
      # Infrapalvelu -> control-planelle (workerit jäävät workereille)
      nodeSelector: { kubernetes.io/hostname: autoqad-control }
      tolerations:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-10-13T13-34-11Z
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          valueFrom: { secretKeyRef: { name: minio-credentials, key: access-key } }
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: minio-credentials, key: secret-key } }
        ports:
        - { name: s3, containerPort: 9000 }
        - { name: console, containerPort: 9001 }
        resources:
          requests: { memory: "256Mi", cpu: "100m" }
          limits:   { memory: "512Mi", cpu: "500m" }
        readinessProbe:
          httpGet: { path: /minio/health/ready, port: 9000 }
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: minio-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: autoqad
  labels: { app: minio }
spec:
  selector: { app: minio }
  ports:
  - { name: s3, port: 9000, targetPort: 9000 }
  - { name: console, port: 9001, targetPort: 9001 }
---
# Konsoli ulos NodePortilla (valinnainen, hallintaa varten)
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: autoqad
  labels: { app: minio }
spec:
  type: NodePort
  selector: { app: minio }
  ports:
  - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
