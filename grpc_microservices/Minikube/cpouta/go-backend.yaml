# Image sisÃ¤ltÃ¤Ã¤ frontend/dist:in (rakennettu build-aikana).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-backend
  namespace: autoqad
  labels: { app: go-backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: go-backend } }
  template:
    metadata: { labels: { app: go-backend } }
    spec:
      containers:
      - name: go-backend
        image: docker.io/skullervo/autoqad-go-backend:ui
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080 }]
        env:
        - { name: PORT, value: "8080" }
        - { name: DATABASE_HOST, value: "autoqad-mssql" }
        - { name: DATABASE_PORT, value: "1433" }
        - { name: DATABASE_USER, value: "sa" }
        - name: DATABASE_PASSWORD
          valueFrom: { secretKeyRef: { name: autoqad-secrets, key: MSSQL_SA_PASSWORD } }
        - { name: DATABASE_NAME, value: "QA-results" }
        - { name: ORTHANC_URL, value: "http://orthanc:8042" }
        - { name: ORTHANC_USERNAME, value: "admin" }
        - name: ORTHANC_PASSWORD
          valueFrom: { secretKeyRef: { name: autoqad-secrets, key: ORTHANC_PASSWORD } }
        - { name: S3_ENDPOINT, value: "http://object-storage:8333" }
        - { name: S3_BUCKET, value: "qa-outputs" }
        - name: S3_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: s3-creds, key: access-key } }
        - name: S3_SECRET_KEY
          valueFrom: { secretKeyRef: { name: s3-creds, key: secret-key } }
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits:   { memory: "256Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: go-backend
  namespace: autoqad
  labels: { app: go-backend }
spec:
  type: NodePort
  selector: { app: go-backend }
  ports:
  - { name: http, port: 8080, targetPort: 8080, nodePort: 30081 }
